
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Registration | CleanCity</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #071d18, #123d32);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .register-box {
            width: 350px;
            max-width: calc(100% - 60px);
            padding: 30px;
            background: #ffffff;
            color: #18372d;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #168653;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #168653;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #106b40;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #168653;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1>CleanCity</h1>

        <p class="subtitle">Create Your Citizen Account</p>

        <form action="{{ url_for('register') }}" method="POST">

            <label>Full Name</label>
            <input type="text" name="name"
                   placeholder="Enter your full name"
                   maxlength="100" required>

            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter your email"
                   maxlength="254" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Create a password"
                   minlength="8" required>

            <button type="submit">Create Account</button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

        <p class="login-link">
            <a href="{{ url_for('home') }}">Back to Home</a>
        </p>

    </div>

</body>
</html>
